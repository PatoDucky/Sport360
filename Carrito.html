<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Carrito - Sport360</title>
        <link rel="stylesheet" href="src/css/style.css">
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css" integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous" />
    </head>
    <body>

        <!-- MENÚ -->
        <table width="95%" align="center" cellpadding="10" cellspacing="10" class="menu">
            <tr>
                <td width="15%" align="center"><img src="Imagenes/Logo1.png" alt="Logo"></td>
                <td align="center"><a href="catalogo/basquetbol.html" class="boton"><i class="fas fa-basketball-ball"></i> Basquetbol</a></td>
                <td align="center"><a href="catalogo/futbol.html" class="boton"><i class="fas fa-futbol"></i> Futbol</a></td>
                <td align="center"><a href="catalogo/voleyball.html" class="boton"> Voleyball</a></td>
                <td align="center"><a href="catalogo/tenis.html" class="boton"> Tenis</a></td>
                <td align="center"><a href="catalogo/Atletismo.html" class="boton"><i class="fas fa-running"></i> Atletismo</a></td>
                <td align="center"><a href="index.html" class="boton"><i class="fas fa-arrow-left"></i> Regresar</a></td>
                <td align="center"><a href="login.html" class="boton"><i class="fas fa-sign-in-alt"></i> Sign in</a></td>
            </tr>
        </table>

        <br>
        <h1 align="center">🛒 Mi Carrito</h1>
        <br>

        <table width="95%" align="center" border="0">
            <tr>
                <!-- PRODUCTOS DEL CARRITO -->
                <td width="75%" valign="top">
                    <table border="1" width="100%" cellpadding="10">
                        <thead>
                            <tr style="background:#f0f0f0;">
                                <th>Imagen</th>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th>Cantidad</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="carrito-items">
                        </tbody>
                    </table>
                </td>

                <!-- RESUMEN -->
                <td width="25%" valign="top">
                    <table border="1" width="100%" cellpadding="10">
                        <tr><td align="center"><h2>Resumen de compra</h2></td></tr>
                        <tr><td><b>Productos:</b> <span id="res-productos">0 artículos</span></td></tr>
                        <tr><td><b>Subtotal:</b> <span id="res-subtotal">$0 MXN</span></td></tr>
                        <tr><td><b>Envío:</b> <span id="res-envio">$0 MXN</span></td></tr>
                        <tr><td><b>IVA (16%):</b> <span id="res-iva">$0 MXN</span></td></tr>
                        <tr><td><h3><span id="res-total">Total: $0 MXN</span></h3></td></tr>
                        <tr>
                            <td align="center">
                                <button class="boton" onclick="mostrarCarrito()">Actualizar carrito</button>
                                <br><br>
                                <button class="boton">Aplicar cupón</button>
                                <br><br>
                                <button class="boton">Proceder al pago</button>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>

        <script src="https://kit.fontawesome.com/5b4a45466f.js" crossorigin="anonymous"></script>
        <script src="src/js/carrito.js"></script>
        <script>
            mostrarCarrito();
        </script>
    </body>
</html>
